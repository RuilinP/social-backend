name: Deploy backend to Google Cloud

on:
  push:
    branches:
      - dev  

env:
  PROJECT_ID: "tactical-codex-448305-v5"  # Change to your GCP project
  GAR_LOCATION: "us-central1"  # Change to your Artifact Registry location
  REPOSITORY: "social-repo"  # Change this to your GAR repository
  IMAGE: "social-backend"  # Change to your image name
  GKE_CLUSTER: "dev-cluster"  # Change to your GKE cluster name
  GKE_ZONE: "us-central1-a"  # Change to your cluster zone
  DEPLOYMENT_NAME: "backend"  # Define your backend deployment name

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev

      - name: Build and Push Docker Image
        run: |
          IMAGE_TAG="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}"
          docker build -t $IMAGE_TAG .
          docker push $IMAGE_TAG

      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}

      - name: Deploy to GKE
  run: |
    # Check if deployment exists
    if kubectl get deployment ${{ env.DEPLOYMENT_NAME }}; then
      echo "Updating existing deployment..."
      kubectl set image deployment/${{ env.DEPLOYMENT_NAME }} social-backend=${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}
    else
      echo "Creating new deployment..."
      kubectl apply -f k8s/backend-deployment.yml
    fi
    
    kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }}

