apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: social-backend  # ✅ Correct container name
          image: us-central1-docker.pkg.dev/tactical-codex-448305-v5/social-repo/social-backend:latest
          ports:
            - containerPort: 5000
          env:
            - name: DATABASE_URL
              value: "mysql://ruilin:alarm@34.234.162.51:3306/social"
